<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="description" content="MakersBrain workshop members" />
		<!-- These files are generated into static/ from @makersbrain/ui by
		     scripts/sync-icons.mjs, which runs before dev and build. They are
		     here rather than imported because this app is ssr=false: a
		     <svelte:head> icon would not exist until the bundle has booted.
		     theme-color matches --mb-bg in each theme, so the browser chrome does not flash a
		     colour the page never uses. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#F7F3EE" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#130F0D" media="(prefers-color-scheme: dark)" />
		<script src="/runtime-config.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display:contents">%sveltekit.body%</div>
	</body>
</html>
