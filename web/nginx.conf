server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(),microphone=(),geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.makersbrain.app https://*.makersbrain.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.makersbrain.app https://*.makersbrain.net" always;
  location = /plateform {
    return 308 /platform$is_args$args;
  }
  location /_app/immutable/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /_app/version.json {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
  }
  location = /health/live { access_log off; return 200 'live\n'; add_header Content-Type text/plain; }
}
