name: CI

# One job. It runs the Rust suite, the deployment-contract and secret-boundary
# checks, the rootless Podman render/validate pass and the browser build against
# a Postgres service.
#
# The Odoo lanes this file used to carry moved to MakersBrain/mb-odoo-addons,
# which owns every module loaded into the Odoo process. Cross-boundary
# compatibility is proven by the bridge lane, not by running both suites here.
#
# GitHub Actions is the assumption here, not a requirement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository is private, so its runner minutes are billed. The single job
  # below is ~9 minutes of Rust, npm and Podman work, and it ran on every push
  # including documentation-only ones. This gate skips it when nothing but
  # Markdown changed.
  #
  # The job is skipped with `if:` rather than the workflow filtered with
  # `on.paths`: a filtered workflow never reports its check runs, and "Control
  # plane" is a required status check on main, so a docs-only pull request would
  # become unmergeable. A skipped job still reports and counts as satisfied.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          else
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || echo FORCE_ALL)
          fi
          printf 'changed paths:\n%s\n' "$changed"
          # Run unless every changed path is Markdown. Anything unrecognised
          # errs toward running the suite.
          if printf '%s\n' "$changed" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation-only change; the control plane suite will skip" >> "$GITHUB_STEP_SUMMARY"
          fi

  control-plane:
    name: Control plane
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: control_test
          POSTGRES_USER: control
          POSTGRES_PASSWORD: control
        options: >-
          --health-cmd "pg_isready -U control -d control_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    permissions:
      contents: read
      packages: read
    env:
      CONTROL_TEST_DATABASE_URL: postgres://control:control@localhost:5432/control_test
      CONTROL_TEST_ADMIN_URL: postgres://control:control@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with: {toolchain: "1.96", components: "rustfmt,clippy"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22", cache: "npm", cache-dependency-path: "web/package-lock.json"}
      - run: cargo fmt --check --manifest-path Cargo.toml
      - run: python3 tools/validate_contract.py
      - run: python3 tools/test_validate_contract.py
      - run: python3 tools/test_compose_secret_canary.py
      - run: python3 tools/test_local_secret_bootstrap.py
      - run: python3 tools/test_dynamic_secret_boundary.py
      - run: python3 tools/test_privacy_deployment_gate.py
      - run: python3 tools/test_tenant_query_scope.py
      - run: python3 tools/test_tenant_execution_scope.py
      - run: python3 tools/test_worker_execution_scope.py
      - run: python3 tools/test_release_host_guard.py
      - run: python3 tools/test_environment_access.py
      - run: python3 tools/test_http_client_construction.py
      - run: python3 tools/test_log_safety.py
      - run: python3 tools/test_verify_github_oidc_claims.py
      - run: python3 tools/test_topology_odoo_isolation.py --self-test
      - run: python3 tools/test_workspace_configuration.py
      - run: cargo clippy --locked --all-targets --manifest-path Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path Cargo.toml -- --test-threads=1
      - name: PostgreSQL schema epoch tests
        run: cargo test --locked --manifest-path Cargo.toml --test schema_epoch -- --ignored --test-threads=1
      - name: PostgreSQL integration tests
        run: cargo test --locked --manifest-path Cargo.toml --test postgres -- --ignored --test-threads=1
      - name: Handler-level workshop authorization matrix
        run: 'cargo test --locked --manifest-path Cargo.toml --lib api::routes::tests::actual_workshop_routes_reject_before_handler_database_or_external_effects -- --ignored --test-threads=1'
      - name: PostgreSQL driver boundary tests
        run: 'cargo test --locked --manifest-path Cargo.toml --lib docker_driver:: -- --ignored --test-threads=1'
      - name: PostgreSQL scheduler boundary tests
        run: 'cargo test --locked --manifest-path Cargo.toml --lib backup_scheduler:: -- --ignored --test-threads=1'
      - name: PostgreSQL privacy cleanup boundary tests
        run: 'cargo test --locked --manifest-path Cargo.toml --lib workers::privacy:: -- --ignored --test-threads=1'
      - name: PostgreSQL tenant isolation tests
        run: cargo test --locked --manifest-path Cargo.toml --test tenant_isolation -- --ignored --test-threads=1
      - name: Runtime database role matrix
        run: sh tools/test-role-matrix.sh
      - name: Generated browser API client is current
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/generated/control-api.ts
        working-directory: web
      # The design system is @makersbrain/brand on GitHub Packages, which npm
      # cannot reach anonymously even for a package in this same org. The
      # workflow's own token is enough; the job declares packages: read for it.
      - name: Authenticate to GitHub Packages
        run: npm config set --location=user //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web

  # Cross-repository compatibility verifies the current bridge client against
  # the current external provider.
  #
  # The /mb_control/v1 provider lives in mb-odoo-addons and this repository is
  # its only client. Since the split each side's CI can be entirely green while
  # the two disagree: the provider's generated contract catches a route being
  # renamed, but not a field changing meaning, an error status moving, or an
  # idempotency key quietly ceasing to be honoured. Only driving the real client
  # against a real bridge catches those.
  #
  # It runs against the digest pinned in deploy/odoo-image.json. mb-infra runs
  # the same lane against a candidate image when composing a release with a new
  # combination, which is the case this cannot cover.
  bridge:
    name: Bridge compatibility
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the bridge provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MakersBrain/mb-odoo-addons
          ref: main
          path: bridge-provider
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with: {toolchain: "1.96"}

      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Boot the pinned Odoo bridge
        id: bridge
        run: |
          set -euo pipefail
          runtime=$(jq -r .deployment_ref deploy/odoo-image.json)
          case "$runtime" in
            *@sha256:*) ;;
            *) echo "::error::deploy/odoo-image.json is not digest-pinned" >&2; exit 1 ;;
          esac
          echo "Odoo runtime: $runtime"

          # A fresh bootstrap credential per run. The provider accepts this only
          # until a tenant credential exists, which is exactly the exchange the
          # lane exercises.
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

          # CI binds the provider checkout at the same read-only path populated
          # from the qualified extension transport image in deployment.
          extension="$GITHUB_WORKSPACE/bridge-provider/addons"
          addons=/opt/mb-extension/addons,/usr/lib/python3/dist-packages/odoo/addons

          # Install the bridge and its dependencies into a fresh database.
          # HOST/PORT/USER/PASSWORD, not --db_host: the official Odoo entrypoint
          # builds its own connection arguments from these and defaults HOST to
          # "db", which wins over the flag. deploy/compose.yml uses the same
          # contract.
          db_env="-e HOST=127.0.0.1 -e PORT=5432 -e USER=odoo -e PASSWORD=odoo"

          docker run --rm --network host $db_env \
            -v "$extension:/opt/mb-extension/addons:ro" \
            -e MB_CONTROL_BRIDGE_TOKEN="$token" \
            "$runtime" \
            odoo -d bridge \
                 --init auth_oauth,mb_control_bridge,mb_email_bridge,mb_inventory_capture,mb_invoice_capture \
                 --without-demo=all --stop-after-init --no-http \
                 --addons-path="$addons"

          docker run -d --name odoo-bridge --network host $db_env \
            -v "$extension:/opt/mb-extension/addons:ro" \
            -e MB_CONTROL_BRIDGE_TOKEN="$token" \
            "$runtime" \
            odoo -d bridge --db-filter='^bridge$' \
                 --addons-path="$addons" --workers=0

          for attempt in $(seq 1 60); do
            # 401 means it is serving and refusing us, which is all this needs.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8069/mb_control/v1/health || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "bridge answering after ${attempt}s (HTTP $code)"; exit 0
            fi
            sleep 1
          done
          echo "::error::the bridge never answered on /mb_control/v1/health" >&2
          docker logs odoo-bridge | tail -40
          exit 1

      - name: Drive the client against the bridge
        env:
          MB_ODOO_BASE_URL: http://127.0.0.1:8069
          MB_ODOO_BOOTSTRAP_TOKEN: ${{ steps.bridge.outputs.token }}
        run: cargo test --locked --test bridge_compatibility -- --ignored --test-threads=1

      - name: Bridge logs and a raw probe on failure
        if: failure()
        run: |
          # The client maps 4xx to Rejected and drops the body, which is right
          # for production and useless for diagnosis. Ask the bridge directly.
          echo "--- raw health ---"
          curl -si -H "Authorization: Bearer ${{ steps.bridge.outputs.token }}" \
            http://127.0.0.1:8069/mb_control/v1/health | head -20 || true
          echo "--- installed modules ---"
          docker exec odoo-bridge odoo shell -d bridge --no-http 2>/dev/null <<'PY' || true
          print([m.name for m in env['ir.module.module'].search([('state','=','installed'),('name','in',['auth_oauth','mb_control_bridge'])])])
          PY
          echo "--- bridge log ---"
          docker logs odoo-bridge 2>&1 | tail -60
