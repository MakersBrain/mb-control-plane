name: CI

# Four lanes, ordered by how fast they fail. `static` needs no container and
# finishes in seconds, so a broken manifest never costs an eight-minute image
# pull. The three Odoo lanes run in parallel behind it.
#
# GitHub Actions is the assumption here, not a requirement: every lane is a
# handful of `odoo` invocations against a Postgres service, so the translation
# to GitLab CI or Forgejo is mechanical.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bumping this is a deliberate act: the addons declare 19.0.x versions and use
  # Odoo 19 extension points. Pin the digest too once one is chosen.
  ODOO_IMAGE: odoo:19
  MODULES: >-
    mb_workshop_base,mb_label,mb_label_pos,mb_ceramics_firing,mb_kiln_bridge,mb_catalogue_sync,mb_depot,mb_payment_sumup,mb_pos_sumup,mb_account_payment_sumup,l10n_fr_micro_enterprise,l10n_fr_micro_urssaf,mb_control_bridge,mb_ai_bridge,mb_invoice_capture,mb_inventory_capture,mb_inventory_capture_catalogue
  # The same list with each name as a `/module` test spec. This is not
  # decoration: `--test-enable` on its own also runs the tests of every
  # dependency Odoo installs — the whole of mail, stock, account and
  # point_of_sale — which is thousands of upstream tests, takes well past ten
  # minutes, and tells us nothing about this repository. Restricting to
  # `/module` specs runs only tests defined in these addons.
  TEST_TAGS: >-
    /mb_workshop_base,/mb_label,/mb_label_pos,/mb_ceramics_firing,/mb_kiln_bridge,/mb_catalogue_sync,/mb_depot,/mb_payment_sumup,/mb_pos_sumup,/mb_account_payment_sumup,/l10n_fr_micro_enterprise,/l10n_fr_micro_urssaf,/mb_control_bridge,/mb_ai_bridge,/mb_invoice_capture,/mb_inventory_capture,/mb_inventory_capture_catalogue

jobs:
  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.96", components: "rustfmt,clippy"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm", cache-dependency-path: "control-plane/web/package-lock.json"}
      - run: cargo fmt --check --manifest-path control-plane/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path control-plane/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path control-plane/Cargo.toml
      - run: npm ci
        working-directory: control-plane/web
      - run: npm run check && npm run build
        working-directory: control-plane/web

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pipx install ruff

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Manifests, data paths, assets, XML, access rules, dependency graph
        run: python3 tools/check_addons.py

      # Catalogue completeness and safety, plus the source scanner that catches
      # user-facing text extraction cannot see because it is not wrapped in
      # `_()` or `_t()`. Stricter than `msgfmt` on purpose: Odoo's exporter does
      # not emit the `#, python-format` flags gettext needs to validate
      # placeholders, so `%(product)s` disappearing in translation is a runtime
      # crash that only this checker catches.
      #
      # This lane does not prove the committed POT still matches the source —
      # that needs a database with the addons installed, so it lives in the
      # `i18n` lane below.
      - name: Install polib
        run: pip install polib

      - name: Translation catalogues and source marking
        run: python3 tools/check_i18n.py --all --summary

      # gettext's own opinion, which is narrower than the checker above but
      # independent of it: a malformed header or a format string gettext cannot
      # parse fails here even if our parser accepted it.
      - name: gettext validation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          status=0
          for f in addons/*/i18n/fr.po; do
            msgfmt --check-header --check-format -o /dev/null "$f" || status=1
          done
          for f in addons/*/i18n/*.pot; do
            msgfmt --check-format -o /dev/null "$f" || status=1
          done
          exit $status

  install:
    name: Clean install
    runs-on: ubuntu-latest
    needs: static
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          # Odoo requires UTF-8 with a deterministic collation, and an index
          # built under a locale-aware one sorts differently from how Odoo
          # compares. Must match docker-compose.yml.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      - name: Install every addon on an empty database
        # `oca` is created empty and left that way on purpose: no addon here may
        # depend on an AGPL-3 module, and a green run with an empty OCA path is
        # what proves it. See SPEC.md, "Licence boundary".
        run: |
          mkdir -p oca
          docker run --rm --network host \
            -v "$PWD/addons:/mnt/makersbrain-addons:ro" \
            -v "$PWD/oca:/mnt/oca-addons:ro" \
            "$ODOO_IMAGE" \
            odoo --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo \
                 -d ci_install -i "$MODULES" \
                 --stop-after-init --log-level=warn

  upgrade:
    name: Upgrade in place
    runs-on: ubuntu-latest
    needs: static
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      # Install then upgrade in one container so the filestore and data-dir are
      # the same on both passes.
      #
      # This proves `-u` is a no-op rather than a crash, which catches a broken
      # data file or a field that cannot be recomputed. It does not prove
      # migration from a previously released version, and is not meant to:
      # nothing is released, so there is no prior version to migrate from, and
      # development databases are rebuilt rather than migrated. See SPEC.md,
      # "Migration scripts start at first release" — that is when this lane
      # needs a second database restored from the last tag.
      - name: Install, then upgrade
        run: |
          mkdir -p oca
          run_odoo() {
            docker run --rm --network host \
              -v "$PWD/addons:/mnt/makersbrain-addons:ro" \
              -v odoo-ci-data:/var/lib/odoo \
              "$ODOO_IMAGE" \
              odoo --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                   --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                   "$@"
          }
          run_odoo -d ci_upgrade -i "$MODULES" --stop-after-init --log-level=warn
          run_odoo -d ci_upgrade -u "$MODULES" --stop-after-init --log-level=warn

  i18n:
    name: Catalogue freshness
    runs-on: ubuntu-latest
    needs: static
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      # The committed POT files must equal what Odoo extracts from the current
      # source. The `static` lane proves the catalogues are complete and safe
      # against the committed POT; it cannot prove the POT itself is current,
      # because extraction needs a database with the addons installed and their
      # views and model metadata loaded.
      #
      # French is loaded before the addons are installed, which is also the
      # order a deployment uses: it makes the install path import each addon's
      # fr.po, so a catalogue that Odoo refuses fails here rather than in
      # production.
      #
      # Every addon in `addons/` is installed, not the shorter `MODULES` list
      # the other lanes use — a translation gate that skipped addons would be
      # a gate with holes in it.
      #
      # `--user root` because the exporter writes into the mounted workspace and
      # the image runs as uid 101. Nothing after this step writes to the tree.
      - name: Export every POT and assert no drift
        run: |
          mkdir -p oca
          ALL_MODULES=$(ls addons | paste -sd, -)
          docker run --rm --network host --user root \
            -v "$PWD/addons:/mnt/makersbrain-addons" \
            "$ODOO_IMAGE" \
            odoo --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo \
                 -d ci_i18n -i base --stop-after-init --without-demo=all --log-level=warn
          docker run --rm --network host --user root \
            -v "$PWD/addons:/mnt/makersbrain-addons" \
            "$ODOO_IMAGE" \
            odoo i18n loadlang \
                 --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo -d ci_i18n -l fr_FR
          docker run --rm --network host --user root \
            -v "$PWD/addons:/mnt/makersbrain-addons" \
            "$ODOO_IMAGE" \
            odoo --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo \
                 -d ci_i18n -i "$ALL_MODULES" --stop-after-init --without-demo=all --log-level=warn
          docker run --rm --network host --user root \
            -v "$PWD/addons:/mnt/makersbrain-addons" \
            "$ODOO_IMAGE" \
            odoo i18n export \
                 --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo -d ci_i18n $(ls addons | tr '\n' ' ') -l pot
          sudo chown -R "$(id -u):$(id -g)" addons
          # `add -N` so a POT added in this very commit is visible to `git diff`
          # rather than being silently skipped as untracked. `-I` because the
          # exporter stamps both date headers on every run, which is not drift.
          git add -N -- 'addons/*/i18n/*.pot'
          git diff --exit-code -I '^"(POT-Creation-Date|PO-Revision-Date)' \
            -- 'addons/*/i18n/*.pot' \
            || { echo "::error::Committed POT files are stale. Re-export them."; exit 1; }

  test:
    name: Server and browser tests
    runs-on: ubuntu-latest
    needs: static
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      # The 192 server test methods. `--test-tags` implies `--test-enable`,
      # which implies `--stop-after-init`. Odoo exits non-zero when a test
      # fails, so the result needs no log scraping.
      #
      # The 17 Hoot tests are NOT in this lane. They run inside a browser,
      # driven by `web`'s own WebSuite.test_unit_desktop, and the odoo:19 image
      # ships no browser — so the tag needed is `/web:WebSuite.test_unit_desktop
      # [@mb_label,@mb_label_pos]` against an image that has Chromium. Building
      # that image is a real task and is deliberately not faked here with a lane
      # that would pass by running nothing. Until then the Hoot suite is run by
      # hand; see README.md.
      #
      # The database must be new for this to mean anything: `-i` on a database
      # where the modules are already installed is a no-op, and at_install tests
      # then silently do not run — a green lane that tested nothing. Here the
      # Postgres service is created fresh per job, so `ci_test` cannot exist.
      # `make test` cannot rely on that and force-drops instead.
      #
      # Not covered, and not pretended otherwise: physical printer and scanner
      # qualification. The Phomemo M110 and NIIMBOT D110 packet builders are
      # tested against fixtures, and no device is attached to any runner.
      - name: Run the suite
        run: |
          mkdir -p oca
          docker run --rm --network host \
            -v "$PWD/addons:/mnt/makersbrain-addons:ro" \
            "$ODOO_IMAGE" \
            odoo --addons-path=/mnt/makersbrain-addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo \
                 -d ci_test -i "$MODULES" \
                 --test-tags "$TEST_TAGS" --stop-after-init --log-level=test
