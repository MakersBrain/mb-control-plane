name: Immutable release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, certify staging evidence, or promote the certified release
        required: true
        type: choice
        options: [build, certify-staging, promote-production]
      staging_release_artifact:
        description: Immutable OCI release artifact produced by build (certification and promotion)
        required: false
        type: string
      staging_evidence_artifact:
        description: Immutable OCI evidence artifact from the staging host (certification only)
        required: false
        type: string
      staging_qualification_artifact:
        description: Immutable OCI qualification artifact (promotion only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: immutable-release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.OCI_REGISTRY }}
  REPOSITORY_PREFIX: ${{ vars.OCI_REPOSITORY_PREFIX }}
  COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main

jobs:
  build:
    if: inputs.operation == 'build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.0.6
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate protected release inputs
        run: |
          set -eu
          test -n "$REGISTRY"
          test -n "$REPOSITORY_PREFIX"
          jq -e 'length == 6 and all(.[]; test("@sha256:[a-f0-9]{64}$"))' .github/release-third-party-images.json >/dev/null
      - name: Build once, mirror dependencies, scan and sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release/sbom release/vulnerability
          printf '{}\n' > release/images.json

          # The browser image installs @makersbrain/brand from GitHub Packages.
          # The credential is passed as a BuildKit secret rather than an ARG or a
          # COPY, so it is mounted only for the RUN that needs it and never
          # reaches a layer, the image, or the SBOM. Builds that do not mount it
          # simply ignore it.
          npmrc=$(mktemp)
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$npmrc"

          build_image() {
            name=$1
            context=$2
            dockerfile=$3
            tag="$REGISTRY/$REPOSITORY_PREFIX/$name:$GITHUB_SHA"
            docker buildx build --platform linux/amd64 --file "$dockerfile" \
              --secret "id=npmrc,src=$npmrc" \
              --tag "$tag" --push "$context"
            digest=$(docker buildx imagetools inspect "$tag" --raw | sha256sum | cut -d' ' -f1)
            immutable="$REGISTRY/$REPOSITORY_PREFIX/$name@sha256:$digest"
            record_image "$name" "$immutable"
          }

          record_image() {
            name=$1
            immutable=$2
            syft "$immutable" -o "spdx-json=release/sbom/$name.spdx.json"
            trivy image --ignore-unfixed --format json --output "release/vulnerability/$name.json" "$immutable"
            trivy image --ignore-unfixed --exit-code 1 --severity CRITICAL "$immutable"
            cosign sign --yes "$immutable"
            jq --arg name "$name" --arg image "$immutable" '. + {($name): $image}' \
              release/images.json > release/images.next.json
            mv release/images.next.json release/images.json
          }

          build_image control control-plane control-plane/Dockerfile
          build_image web control-plane/web control-plane/web/Dockerfile
          build_image odoo . control-plane/deploy/Odoo.Dockerfile
          build_image paperless control-plane/deploy control-plane/deploy/Paperless.Dockerfile
          build_image backup control-plane/deploy control-plane/deploy/Backup.Dockerfile
          build_image postgres control-plane/deploy control-plane/deploy/Postgres.Dockerfile

          jq -r 'to_entries[] | [.key, .value] | @tsv' .github/release-third-party-images.json |
          while IFS=$'\t' read -r name source; do
            tag="$REGISTRY/$REPOSITORY_PREFIX/$name:$GITHUB_SHA"
            docker buildx imagetools create --tag "$tag" "$source"
            digest=$(docker buildx imagetools inspect "$tag" --raw | sha256sum | cut -d' ' -f1)
            record_image "$name" "$REGISTRY/$REPOSITORY_PREFIX/$name@sha256:$digest"
          done

          test "$(jq length release/images.json)" -eq 12
          jq -e 'keys == ["alpine", "backup", "cloudflared", "control", "nginx", "odoo", "paperless", "postgres", "rauthy", "redis", "vmagent", "web"]' release/images.json >/dev/null
          release_id="control-$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:16}"
          jq -n \
            --arg release_id "$release_id" \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg ci_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile images release/images.json \
            '{release_id: $release_id, source_commit: $source_commit, source_ref: $source_ref, ci_run_url: $ci_run_url, staging_qualification_ref: "", images: $images[0]}' \
            > release/release-record.json
          printf '%s\n' "$release_id" > release/release-id.txt
          tar -C release -czf release/sbom.tar.gz sbom
          tar -C release -czf release/vulnerability.tar.gz vulnerability
          artifact="$REGISTRY/$REPOSITORY_PREFIX/releases:$release_id"
          oras push "$artifact" \
            --artifact-type application/vnd.makersbrain.release.v1+json \
            release/release-record.json:application/json \
            release/images.json:application/json \
            release/sbom.tar.gz:application/vnd.makersbrain.sbom.layer.v1.tar+gzip \
            release/vulnerability.tar.gz:application/vnd.makersbrain.vulnerability.layer.v1.tar+gzip
          digest=$(oras resolve "$artifact")
          printf '%s@%s\n' "$REGISTRY/$REPOSITORY_PREFIX/releases" "$digest" \
            > release/artifact-reference.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-release-${{ github.sha }}
          path: release/
          retention-days: 30

  certify-staging:
    if: inputs.operation == 'certify-staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate and publish staging qualification
        env:
          STAGING_ARTIFACT: ${{ inputs.staging_release_artifact }}
          EVIDENCE_ARTIFACT: ${{ inputs.staging_evidence_artifact }}
        run: |
          set -euo pipefail
          case "$STAGING_ARTIFACT" in
            "$REGISTRY/$REPOSITORY_PREFIX/releases@sha256:"*) ;;
            *) echo "staging release must be an immutable repository digest" >&2; exit 1 ;;
          esac
          case "$EVIDENCE_ARTIFACT" in
            "$REGISTRY/$REPOSITORY_PREFIX/staging-evidence@sha256:"*) ;;
            *) echo "staging evidence must be an immutable repository digest" >&2; exit 1 ;;
          esac
          mkdir release evidence-package qualification
          oras pull --output release "$STAGING_ARTIFACT"
          oras pull --output evidence-package "$EVIDENCE_ARTIFACT"
          test -d evidence-package/evidence
          python3 control-plane/deploy/podman/qualification.py create \
            --release-record release/release-record.json \
            --evidence-dir evidence-package/evidence \
            --output qualification/staging-qualification.json
          tar -C evidence-package -czf qualification/evidence.tar.gz evidence
          qualification_id=$(jq -r .qualification_id qualification/staging-qualification.json)
          artifact="$REGISTRY/$REPOSITORY_PREFIX/qualifications:$qualification_id"
          oras push "$artifact" \
            --artifact-type application/vnd.makersbrain.staging-qualification.v1+json \
            qualification/staging-qualification.json:application/json \
            qualification/evidence.tar.gz:application/vnd.makersbrain.staging-evidence.v1.tar+gzip
          digest=$(oras resolve "$artifact")
          printf '%s@%s\n' "$REGISTRY/$REPOSITORY_PREFIX/qualifications" "$digest"

  promote-production:
    if: inputs.operation == 'promote-production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.0.6
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify staging record and publish production promotion
        env:
          STAGING_ARTIFACT: ${{ inputs.staging_release_artifact }}
          QUALIFICATION_ARTIFACT: ${{ inputs.staging_qualification_artifact }}
        run: |
          set -euo pipefail
          test -n "$STAGING_ARTIFACT"
          case "$STAGING_ARTIFACT" in
            "$REGISTRY/$REPOSITORY_PREFIX/releases@sha256:"*) ;;
            *) echo "staging artifact must be an immutable repository digest" >&2; exit 1 ;;
          esac
          case "$QUALIFICATION_ARTIFACT" in
            "$REGISTRY/$REPOSITORY_PREFIX/qualifications@sha256:"*) ;;
            *) echo "qualification must be an immutable repository digest" >&2; exit 1 ;;
          esac
          mkdir release qualification qualification-evidence
          oras pull --output release "$STAGING_ARTIFACT"
          oras pull --output qualification "$QUALIFICATION_ARTIFACT"
          python3 control-plane/deploy/podman/qualification.py extract \
            --archive qualification/evidence.tar.gz \
            --output qualification-evidence
          python3 control-plane/deploy/podman/qualification.py validate \
            --record qualification/staging-qualification.json \
            --release-record release/release-record.json \
            --evidence-dir qualification-evidence/evidence
          jq -e '.staging_qualification_ref == ""' release/release-record.json >/dev/null
          source_ref=$(jq -er '.source_ref | select(test("^refs/(heads|tags)/"))' release/release-record.json)
          jq -r '.images[]' release/release-record.json |
          while IFS= read -r image; do
            cosign verify \
              --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
              --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$source_ref" \
              "$image" >/dev/null
          done
          jq --arg qualification "$QUALIFICATION_ARTIFACT" \
            '.staging_qualification_ref = $qualification' \
            release/release-record.json > release/production-release-record.json
          release_id=$(jq -r .release_id release/production-release-record.json)
          artifact="$REGISTRY/$REPOSITORY_PREFIX/releases:production-$release_id"
          oras push "$artifact" \
            --artifact-type application/vnd.makersbrain.production-release.v1+json \
            release/production-release-record.json:application/json
          printf '%s\n' "$artifact"
