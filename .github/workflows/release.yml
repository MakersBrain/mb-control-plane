name: Control plane release

# Publishes this repository's own signed, digest-addressed images and the
# component release record describing them. It does not compose a platform
# release and touches no environment: MakersBrain/mb-infra consumes these
# digests, adds the Odoo image published by MakersBrain/mb-odoo-addons, and
# owns staging qualification and production promotion.
#
# Five images, exactly the ones deploy/release-contract.json declares with
# source_repository MakersBrain/mb-control-plane. The Odoo image and the
# mirrored operational-support images are somebody else's to sign; deployment
# verifies each against its own repository via deploy/podman/provenance.py.
#
# No SBOM or vulnerability scan yet, matching the deferral in mb-odoo-addons and
# carrying the same debt: migration plan sections 4.1 and 4.3 require both
# before Phase 5 staging qualification.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and describe without publishing or signing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: control-plane-release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.OCI_REGISTRY }}
  REPOSITORY_PREFIX: ${{ vars.OCI_REPOSITORY_PREFIX }}

jobs:
  # Verify the suite that already ran for this commit rather than running it
  # again. CI is a required status check on main, so a commit cannot be there
  # without a green run, and re-running would spend a second full suite proving
  # what main has already proven.
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Listing workflow runs needs this explicitly on a private repository.
      # The same job in mb-odoo-addons works without it only because that
      # repository is public, which makes its runs readable anyway -- so this is
      # latent breakage there too, not a difference in what the job needs.
      actions: read
    steps:
      - name: The CI suite passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // "none"')
          echo "CI conclusion for $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run for $GITHUB_SHA (found: $conclusion). Refusing to publish." >&2
            exit 1
          fi

  build:
    needs: verify-ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
      packages: write   # publish images, and read @makersbrain/brand for the web build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Validate release inputs
        run: |
          set -eu
          test -n "$REGISTRY"
          test -n "$REPOSITORY_PREFIX"
          python3 tools/validate_contract.py

      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build and sign every image this repository owns
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          printf '{}\n' > release/images.json

          # The browser image installs @makersbrain/brand from GitHub Packages.
          # It is passed as a BuildKit secret rather than an ARG or a COPY, so it
          # is mounted only for the RUN that needs it and never reaches a layer
          # or the published image.
          npmrc=$(mktemp)
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$npmrc"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            output="type=docker"
          else
            output="type=image,push=true"
          fi

          build_image() {
            name=$1; context=$2; dockerfile=$3
            image="$REGISTRY/$REPOSITORY_PREFIX/mb-$name"
            echo "::group::$name"
            docker buildx build \
              --platform linux/amd64 \
              --file "$context/$dockerfile" \
              --secret "id=npmrc,src=$npmrc" \
              --build-arg "SOURCE_COMMIT=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.title=mb-$name" \
              --tag "$image:$GITHUB_SHA" \
              --metadata-file "metadata-$name.json" \
              --output "$output" \
              "$context"

            # buildx reports the digest it actually produced; do not re-derive it.
            digest=$(jq -r '."containerimage.digest"' "metadata-$name.json")
            test -n "$digest" && test "$digest" != "null"

            if [ "${{ inputs.dry_run }}" != "true" ]; then
              cosign sign --yes "$image@$digest"
            fi

            jq --arg name "$name" --arg image "$image@$digest" \
              '. + {($name): $image}' release/images.json > release/images.next.json
            mv release/images.next.json release/images.json
            echo "::endgroup::"
          }

          # Exactly the contract's source_repository == this repository set.
          build_image control   .      Dockerfile
          build_image web       web    Dockerfile
          build_image paperless deploy Paperless.Dockerfile
          build_image backup    deploy Backup.Dockerfile
          build_image postgres  deploy Postgres.Dockerfile

          echo "--- images ---"
          cat release/images.json

      - name: Component release record
        id: record
        run: |
          set -euo pipefail
          # Cross-check against the contract rather than trusting the loop above:
          # an image silently dropped from the build is a release that quietly
          # ships less than it claims.
          expected=$(jq -r '
            [.images | to_entries[]
             | select(.value.source_repository == "MakersBrain/mb-control-plane")
             | .key] | sort | join(",")' deploy/release-contract.json)
          actual=$(jq -r '[keys[]] | sort | join(",")' release/images.json)
          if [ "$expected" != "$actual" ]; then
            echo "::error::built [$actual] but the contract declares [$expected]" >&2
            exit 1
          fi

          jq -n \
            --arg schema "makersbrain.control-plane.release.v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg ci_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg schema_release "$(jq -r .schema_release deploy/release-contract.json)" \
            --arg schema_compatibility "$(jq -r .schema_compatibility deploy/release-contract.json)" \
            --arg contract_release "$(jq -r .release deploy/release-contract.json)" \
            --slurpfile images release/images.json \
            '{schema: $schema,
              source: {repository: $repository, commit: $commit, ref: $ref, ci_run: $ci_run},
              contract_release: $contract_release,
              schema_release: $schema_release,
              schema_compatibility: $schema_compatibility,
              image_count: ($images[0] | length),
              images: $images[0]}' > release/release-metadata.json
          cp deploy/release-contract.json release/
          cat release/release-metadata.json

          # Assemble the publish list here, in a step the dry run also executes.
          # The push itself is the one step a rehearsal can never exercise, so
          # nothing is decided inside it.
          for file in release/release-metadata.json release/release-contract.json; do
            test -s "$file" || { echo "::error::$file is missing or empty" >&2; exit 1; }
          done
          echo "files=release/release-metadata.json:application/json release/release-contract.json:application/json" >> "$GITHUB_OUTPUT"

      - name: Publish the component release record
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          artifact="$REGISTRY/$REPOSITORY_PREFIX/mb-control-plane-release:${GITHUB_SHA}"
          oras push "$artifact" \
            --artifact-type application/vnd.makersbrain.control-plane-release.v1+json \
            ${{ steps.record.outputs.files }}
          # Not signed separately: its digest is recorded here and bound by
          # mb-infra's composed release record, the single provenance anchor
          # (migration plan section 2.6).
          printf '%s@%s\n' "$artifact" "$(oras resolve "$artifact")" | tee release/artifact-reference.txt

      - name: Summary
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Control plane release rehearsal (dry run)"
              echo
              echo "Built and described. Nothing was signed or published."
            else
              echo "### Control plane release"
            fi
            echo
            echo "| image | reference |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"' release/images.json
            echo
            if [ -f release/artifact-reference.txt ]; then
              echo "Record: \`$(cat release/artifact-reference.txt)\`"
              echo
              echo "Consume these digests from \`mb-infra\`. Do not deploy the tags."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane-release-${{ github.sha }}
          path: release/
          retention-days: 90
