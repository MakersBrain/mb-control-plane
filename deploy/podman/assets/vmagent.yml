global:
  scrape_interval: 15s
  external_labels:
    environment: '@@ENVIRONMENT@@'

scrape_configs:
  - job_name: control-api-live
    metrics_path: /internal/metrics/live
    authorization:
      type: Bearer
      credentials_file: /run/secrets/control-metrics-token
    static_configs:
      - targets: [control-api:8080]

  - job_name: control-api-database
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/control-metrics-token
    static_configs:
      - targets: [control-api:8080]

  - job_name: vmagent
    static_configs:
      - targets: [127.0.0.1:8429]

@@CATALOGUE_SCRAPE_JOBS@@
