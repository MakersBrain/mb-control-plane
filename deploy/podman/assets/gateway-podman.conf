worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 128m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Fixed private network gateway is the rootless Podman DNS listener.
    resolver 10.89.0.1 ipv6=off valid=10s;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_cf_visitor $cloudflare_proto {
        default '';
        ~*'"scheme"\s*:\s*"https"' https;
        ~*'"scheme"\s*:\s*"http"' http;
    }
    map "$http_x_forwarded_proto:$cloudflare_proto" $forwarded_proto {
        ~^https: https;
        ~^http: http;
        ~^:https$ https;
        ~^:http$ http;
        default $scheme;
    }
    server {
        listen 8080 default_server;
        server_name _;
        location = /__unregistered_health { return 204; }
        location / { return 404; }
    }
    include /etc/nginx/tenants/*.conf;
}
