route:
  receiver: operator-webhook
  group_by: [alertname, environment]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    # The heartbeat has to arrive on a predictable cadence for its absence to
    # mean anything, so it is not batched or backed off like a real alert.
    - matchers: [severity="heartbeat"]
      receiver: operator-webhook
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m

receivers:
  - name: operator-webhook
    webhook_configs:
      - url_file: /run/secrets/webhook-url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/webhook-token
          http_headers:
            CF-Access-Client-Id:
              files: [/run/secrets/access-client-id]
            CF-Access-Client-Secret:
              files: [/run/secrets/access-client-secret]
