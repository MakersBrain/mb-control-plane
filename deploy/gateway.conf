worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 128m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Docker service addresses can change whenever a container is recreated.
    # Tenant routes use variable proxy targets so nginx resolves them at
    # request time instead of caching an address until the next reload.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Cloudflare Tunnel preserves the browser scheme in CF-Visitor. Prefer an
    # explicit X-Forwarded-Proto when one is present, then the Cloudflare value,
    # and only then the direct connection scheme used by local development.
    map $http_cf_visitor $cloudflare_proto {
        default '';
        ~*'"scheme"\s*:\s*"https"' https;
        ~*'"scheme"\s*:\s*"http"' http;
    }

    map "$http_x_forwarded_proto:$cloudflare_proto" $forwarded_proto {
        ~^https: https;
        ~^http: http;
        ~^:https$ https;
        ~^:http$ http;
        default $scheme;
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    include /etc/nginx/tenants/*.conf;
}
