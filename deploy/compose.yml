name: makersbrain-control

x-control-env: &control-env
  CONTROL_DATABASE_URL: postgresql://control:${CONTROL_POSTGRES_PASSWORD}@postgres:5432/makersbrain_control
  CONTROL_TENANT_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
x-worker: &worker
  image: makersbrain-control:local
  build: {context: ..}
  # The driver writes root-owned 0640 tenant secrets; workers join only the
  # container root group so they can read the shared volume without being root.
  user: "10001:0"
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    control-migrate: {condition: service_completed_successfully}
    document-extraction: {condition: service_healthy}
  environment:
    <<: *control-env
    CONTROL_RAUTHY_ADMIN_URL: http://rauthy:8092/auth/v1/
    CONTROL_RAUTHY_ADMIN_KEY: ${CONTROL_RAUTHY_ADMIN_KEY}
    CONTROL_AZURE_MONTHLY_PAGE_LIMIT: "1000"
    CONTROL_AZURE_MONTHLY_IMAGE_LIMIT: "500"
    CONTROL_AZURE_ANALYZE_MIN_INTERVAL_MS: "1100"
    CONTROL_EXTRACTION_BROKER_URL: http://document-extraction:8080
    CONTROL_EXTRACTION_BROKER_TOKEN: ${DOCUMENT_EXTRACTION_TOKEN}
    CONTROL_MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL}
    CONTROL_MAIL_WEBHOOK_TOKEN: ${MAIL_WEBHOOK_TOKEN}
    CONTROL_DEPLOYMENT_DRIVER_URL: ${DEPLOYMENT_DRIVER_URL}
    CONTROL_DEPLOYMENT_DRIVER_TOKEN: ${DEPLOYMENT_DRIVER_TOKEN}
    CONTROL_SECRET_ROOT: /run/makersbrain-secrets
  volumes:
    - tenant-secrets:/run/makersbrain-secrets:ro

services:
  document-extraction:
    image: makersbrain-control:local
    build: {context: ..}
    command: ["/usr/local/bin/document-extraction-broker"]
    environment:
      BROKER_LISTEN: 0.0.0.0:8080
      BROKER_TOKEN: ${DOCUMENT_EXTRACTION_TOKEN}
      BROKER_AZURE_ENDPOINT: ${AZURE_DOCUMENT_ENDPOINT:-}
      BROKER_AZURE_KEY: ${AZURE_DOCUMENT_KEY:-}
      BROKER_AZURE_API_VERSION: ${AZURE_DOCUMENT_API_VERSION:-2024-11-30}
      BROKER_AZURE_POLL_INTERVAL_MS: "2000"
      BROKER_VISION_ENDPOINT: ${INVENTORY_VISION_ENDPOINT:-}
      BROKER_VISION_KEY: ${INVENTORY_VISION_KEY:-}
      BROKER_VISION_MODEL: ${INVENTORY_VISION_MODEL:-}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local-superuser-not-published}
      CONTROL_POSTGRES_PASSWORD: ${CONTROL_POSTGRES_PASSWORD}
      RAUTHY_POSTGRES_PASSWORD: ${RAUTHY_POSTGRES_PASSWORD}
      ODOO_POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD}
    volumes:
      - control-postgres:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped

  rauthy-bootstrap:
    image: alpine:3.22
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        cp /source/clients.json /bootstrap/clients.json
        cp /source/api_keys.json /bootstrap/api_keys.json
        cp /public/roles.json /bootstrap/roles.json
        cp /public/scopes.json /bootstrap/scopes.json
        chown -R 10001:10001 /bootstrap
        chmod 0700 /bootstrap
        chmod 0400 /bootstrap/*.json
    volumes:
      - ./secrets/rauthy:/source:ro
      - ./rauthy:/public:ro
      - rauthy-bootstrap:/bootstrap
    restart: "no"

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.1@sha256:6f35e2e41753e973336d476c9593b4c1e41ac597803adf6ccaec08c7d8818cd0
    environment:
      HIQLITE: "false"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: rauthy
      PG_DB_NAME: rauthy
      PG_PASSWORD: ${RAUTHY_POSTGRES_PASSWORD}
      PG_TLS: disable
      HQL_NODE_ID: "1"
      HQL_NODES: "1 localhost:8100 localhost:8200"
      HQL_SECRET_RAFT: ${RAUTHY_HQL_SECRET_RAFT}
      HQL_SECRET_API: ${RAUTHY_HQL_SECRET_API}
      LISTEN_ADDRESS: 0.0.0.0
      LISTEN_PORT_HTTP: "8092"
      LISTEN_SCHEME: http
      PUB_URL: rauthy.localhost:${RAUTHY_HTTP_PORT:-8092}
      PROXY_MODE: "false"
      BOOTSTRAP_DIR: /bootstrap
      BOOTSTRAP_ADMIN_EMAIL: ${RAUTHY_BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: ${RAUTHY_BOOTSTRAP_ADMIN_PASSWORD}
      ENC_KEYS: ${RAUTHY_ENC_KEYS}
      ENC_KEY_ACTIVE: ${RAUTHY_ENC_KEY_ACTIVE}
      RP_ID: rauthy.localhost
      RP_ORIGIN: http://rauthy.localhost:${RAUTHY_HTTP_PORT:-8092}
      RP_NAME: MakersBrain
      SWAGGER_UI_ENABLE: "false"
    volumes:
      - rauthy-bootstrap:/bootstrap:ro
    ports: ["127.0.0.1:${RAUTHY_HTTP_PORT:-8092}:8092"]
    depends_on:
      postgres: {condition: service_healthy}
      rauthy-bootstrap: {condition: service_completed_successfully}
    networks:
      default:
        aliases: [rauthy.localhost]
    restart: unless-stopped

  control-migrate:
    image: makersbrain-control:local
    build: {context: ..}
    command: ["/usr/local/bin/control-migrate"]
    environment:
      <<: *control-env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  control-api:
    image: makersbrain-control:local
    build: {context: ..}
    environment:
      <<: *control-env
      CONTROL_LISTEN: 0.0.0.0:8080
      CONTROL_PUBLIC_ORIGIN: http://localhost:${CONTROL_WEB_PORT:-4175}/
      CONTROL_CORS_ORIGIN: http://localhost:${CONTROL_WEB_PORT:-4175}/
      CONTROL_OIDC_ISSUER: http://rauthy.localhost:${RAUTHY_HTTP_PORT:-8092}/auth/v1/
      CONTROL_OIDC_AUDIENCE: makersbrain-members
      CONTROL_OIDC_DISCOVERY_URL: http://rauthy:8092/auth/v1/.well-known/openid-configuration
      CONTROL_TENANT_DOMAIN: localhost
      CONTROL_INTERNAL_TOKEN: ${CONTROL_INTERNAL_TOKEN}
      CONTROL_DEPLOYMENT_DRIVER_URL: ${DEPLOYMENT_DRIVER_URL}
      CONTROL_DEPLOYMENT_DRIVER_TOKEN: ${DEPLOYMENT_DRIVER_TOKEN}
      CONTROL_ALLOW_SELF_SIGNUP: "true"
      CONTROL_OPERATOR_EMAILS: ${CONTROL_OPERATOR_EMAILS:-}
    ports: ["127.0.0.1:${CONTROL_API_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      control-migrate: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped

  control-web:
    build:
      context: ../web
      args:
        VITE_CONTROL_API_URL: http://localhost:${CONTROL_API_PORT:-8080}
        VITE_OIDC_ISSUER: http://rauthy.localhost:${RAUTHY_HTTP_PORT:-8092}/auth/v1
        VITE_OIDC_CLIENT_ID: makersbrain-members
        VITE_OIDC_REDIRECT_URI: http://localhost:${CONTROL_WEB_PORT:-4175}/oauth/callback
        VITE_ACCOUNT_URL: http://rauthy.localhost:${RAUTHY_HTTP_PORT:-8092}
    ports: ["127.0.0.1:${CONTROL_WEB_PORT:-4175}:8080"]
    restart: unless-stopped

  integration-fixture:
    image: makersbrain-control:local
    build: {context: ..}
    command: ["/usr/local/bin/control-fixture"]
    environment: {FIXTURE_TOKEN: "${DEPLOYMENT_DRIVER_TOKEN}"}
    restart: unless-stopped

  paperless-image:
    image: makersbrain-control-paperless:local
    build:
      context: .
      dockerfile: Paperless.Dockerfile
    entrypoint: ["/usr/bin/true"]
    restart: "no"

  backup-image:
    image: makersbrain-control-backup:local
    build:
      context: .
      dockerfile: Backup.Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"

  docker-driver:
    image: makersbrain-control:local
    build: {context: ..}
    user: "0:0"
    command: ["/usr/local/bin/control-docker-driver"]
    environment:
      DRIVER_LISTEN: 0.0.0.0:8080
      DRIVER_TOKEN: ${DEPLOYMENT_DRIVER_TOKEN}
      DRIVER_DOCKER_SOCKET: /var/run/docker.sock
      DRIVER_DATABASE_URL: postgresql://control:${CONTROL_POSTGRES_PASSWORD}@postgres:5432/makersbrain_control
      DRIVER_POSTGRES_ADMIN_URL: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD:-local-superuser-not-published}@postgres:5432/postgres
      DRIVER_POSTGRES_HOST: postgres
      DRIVER_POSTGRES_PORT: "5432"
      DRIVER_ODOO_POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      DRIVER_ODOO_BRIDGE_TOKEN: ${ODOO_BRIDGE_TOKEN}
      DRIVER_ODOO_IMAGE: makersbrain-control-odoo:local
      DRIVER_POSTGRES_IMAGE: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
      DRIVER_PAPERLESS_IMAGE: makersbrain-control-paperless:local
      DRIVER_DOCKER_NETWORK: makersbrain-control-runtime
      DRIVER_ODOO_VOLUME: makersbrain-control-odoo-data
      DRIVER_ODOO_UID: ${ODOO_RUNTIME_UID:-100}
      DRIVER_ODOO_GID: ${ODOO_RUNTIME_GID:-101}
      DRIVER_BACKUP_VOLUME: makersbrain-control-backups
      DRIVER_ODOO_DATA_ROOT: /odoo-data
      DRIVER_BACKUP_ROOT: /backups
      DRIVER_BACKUP_AGENT_IMAGE: makersbrain-control-backup:local
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RESTORE_S3_ACCESS_KEY_ID: ${RESTORE_S3_ACCESS_KEY_ID:-}
      RESTORE_S3_SECRET_ACCESS_KEY: ${RESTORE_S3_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_IDENTITY_FILE: ${BACKUP_AGE_IDENTITY_FILE:-}
      BACKUP_ENCRYPTION_KEY_ID: ${BACKUP_ENCRYPTION_KEY_ID:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      DRIVER_REDIS_ADDRESS: redis:6379
      DRIVER_SECRET_ROOT: /run/makersbrain-secrets
      DRIVER_SECRET_VOLUME: makersbrain-control-tenant-secrets
      DRIVER_BACKUP_SECRET_VOLUME: makersbrain-control-backup-secrets
      DRIVER_ROUTE_ROOT: /routes
      DRIVER_GATEWAY_CONTAINER: makersbrain-tenant-gateway
      DRIVER_ODOO_BASE_URL: http://odoo:8069
      DRIVER_CONTROL_INTERNAL_URL: http://control-api:8080
      DRIVER_CONTROL_INTERNAL_TOKEN: ${CONTROL_INTERNAL_TOKEN}
      DRIVER_RAUTHY_ADMIN_URL: http://rauthy:8092/auth/v1
      DRIVER_RAUTHY_ADMIN_KEY: ${CONTROL_RAUTHY_DEPLOYMENT_KEY}
      DRIVER_OIDC_ISSUER: http://rauthy.localhost:${RAUTHY_HTTP_PORT:-8092}/auth/v1
      DRIVER_PUBLIC_SCHEME: http
      DRIVER_PUBLIC_PORT: ${ODOO_HTTP_PORT:-8169}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tenant-secrets:/run/makersbrain-secrets
      - backup-secrets:/run/makersbrain-backup-secrets:ro
      - tenant-routes:/routes
      - odoo-data:/odoo-data
      - backup-data:/backups
    depends_on:
      postgres: {condition: service_healthy}
      control-migrate: {condition: service_completed_successfully}
      odoo: {condition: service_started}
      redis: {condition: service_healthy}
      tenant-gateway: {condition: service_started}
      rauthy: {condition: service_started}
      backup-image: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped

  worker-membership: {<<: *worker, command: ["/usr/local/bin/control-worker", "membership-provisioning"]}
  worker-invoice: {<<: *worker, command: ["/usr/local/bin/control-worker", "invoice-capture"]}
  worker-inventory: {<<: *worker, command: ["/usr/local/bin/control-worker", "inventory-capture"]}
  worker-provisioning: {<<: *worker, command: ["/usr/local/bin/control-worker", "tenant-provisioning"]}
  worker-email: {<<: *worker, command: ["/usr/local/bin/control-worker", "email-delivery"]}
  worker-reconciliation: {<<: *worker, command: ["/usr/local/bin/control-worker", "tenant-reconciliation"]}
  worker-lifecycle: {<<: *worker, command: ["/usr/local/bin/control-worker", "tenant-lifecycle"]}

  backup-scheduler:
    <<: *worker
    command: ["/usr/local/bin/control-backup-scheduler"]
    environment:
      <<: *control-env
      CONTROL_DEPLOYMENT_DRIVER_URL: ${DEPLOYMENT_DRIVER_URL}
      CONTROL_DEPLOYMENT_DRIVER_TOKEN: ${DEPLOYMENT_DRIVER_TOKEN}
      CONTROL_BACKUP_INTERVAL_SECONDS: ${CONTROL_BACKUP_INTERVAL_SECONDS:-3600}
      CONTROL_BACKUP_SCHEDULER_ENABLED: ${CONTROL_BACKUP_SCHEDULER_ENABLED:-false}

  odoo:
    image: makersbrain-control-odoo:local
    container_name: makersbrain-shared-odoo
    build: {context: ../.., dockerfile: control-plane/deploy/Odoo.Dockerfile}
    environment:
      HOST: postgres
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      MB_CONTROL_BRIDGE_TOKEN: ${ODOO_BRIDGE_TOKEN}
      MB_CONTROL_API_URL: http://control-api:8080
    command: ["odoo", "--no-database-list", "--db_host=postgres", "--db_user=odoo", "--db_password=${ODOO_POSTGRES_PASSWORD}", "--addons-path=/mnt/makersbrain-addons,/mnt/oca-addons,/usr/lib/python3/dist-packages/odoo/addons", "--load=base,web,mb_dbfilter_gateway", "--proxy-mode"]
    volumes: ["odoo-data:/var/lib/odoo"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: ["shared-redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped

  tenant-gateway:
    image: nginx:1.29-alpine
    container_name: makersbrain-tenant-gateway
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
      - tenant-routes:/etc/nginx/tenants:ro
    ports: ["127.0.0.1:${ODOO_HTTP_PORT:-8169}:8080"]
    depends_on: {odoo: {condition: service_started}}
    restart: unless-stopped

networks:
  default:
    name: makersbrain-control-runtime

volumes:
  control-postgres: {}
  rauthy-bootstrap: {}
  odoo-data:
    name: makersbrain-control-odoo-data
  shared-redis:
    name: makersbrain-control-redis-data
  tenant-routes:
    name: makersbrain-control-tenant-routes
  tenant-secrets:
    name: makersbrain-control-tenant-secrets
  backup-data:
    name: makersbrain-control-backups
  backup-secrets:
    name: makersbrain-control-backup-secrets
